<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusFlow</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;">

    <div class="card" style="width:100%; max-width:400px; padding:32px 28px;">
        <div style="text-align:center; margin-bottom:24px;">
            <h1 style="font-size:24px; color:#0f172a; margin-bottom:4px;">CampusFlow</h1>
            <p style="color:#64748b; font-size:14px;">Create Your Account</p>
        </div>

        <div id="alert" class="alert" style="display:none;"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Tarun Yadav" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@college.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="role">Select Role</label>
                <select id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="student">Student</option>
                    <option value="staff">Staff</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:10px;">Create Account</button>
        </form>

        <div style="text-align:center; margin-top:20px; font-size:14px; color:#64748b;">
            Already have an account? <a href="login.html" style="color:#2563eb; font-weight:600; text-decoration:none;">Login</a>
        </div>
    </div>

<script src="../assets/js/app.js"></script>
<script>
    checkAlreadyLoggedIn();
</script>
</body>
</html>
